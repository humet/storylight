# CI order per docs/06-engineering/deployment.md.
# No paid provider calls ever run here — tests use fake adapters only.
# Paid model evaluations are a separate, manual release gate (Milestone 10).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests (provider fakes only)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migration validation (empty PGlite + drift check)
        # No live Postgres in CI: migrations are applied to an EMPTY in-process
        # PGlite (real Postgres semantics, no network). `pnpm db:migrate`
        # (drizzle-kit against DATABASE_URL) is the production path only.
        run: |
          # 1. Migrations apply cleanly from an empty database.
          pnpm db:validate
          # 2. Committed migration files are internally consistent.
          pnpm db:check
          # 3. No schema drift: regenerating must not produce a new migration.
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Schema drift: run 'pnpm db:generate' and commit the migration."
            git status --porcelain -- drizzle
            exit 1
          fi
